<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Div</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background: red;
            position: relative;
            border-radius: 10px;
        }
        .name {
            color: #fff;
            text-align: center;
            margin: 0;
            line-height: 100px;
        
        }
    </style>
</head>

<body>

    <div class="box">
        <h3 class="name">Mahabub</h3>
    </div>

    <script>

        let position = 0;

        setInterval(() => {

            position += 10;

            document.querySelector(".box").style.left = position + "px";

            // reset position
            if (position >= 500) {
                position = 0;
            }

        }, 200);

    </script>

</body>

</html>
